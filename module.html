<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RheumLab</title>
<meta name="theme-color" content="#0a0e14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RheumLab">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="assets/pwa/icon.svg">
<link rel="icon" type="image/png" sizes="64x64" href="assets/pwa/icon-64.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/pwa/apple-touch-icon.png">
<script>
(() => {
  const validModules = new Set(['ana', 'anca', 'joints']);
  const defaultTabs = {
    ana: 'ana-patterns',
    anca: 'anca-patterns',
    joints: 'joints-patterns'
  };
  const selectedModuleKey = 'rheum-lab-selected-module';

  function normalizeModule(value) {
    if (typeof value !== 'string') return null;
    const normalized = value.trim().toLowerCase();
    return validModules.has(normalized) ? normalized : null;
  }

  function getModuleFromTab(value) {
    if (typeof value !== 'string') return null;
    const [moduleName] = value.split('-');
    return normalizeModule(moduleName);
  }

  let selectedModule = null;
  try {
    selectedModule = normalizeModule(sessionStorage.getItem(selectedModuleKey));
  } catch {
    selectedModule = null;
  }

  const params = new URLSearchParams(window.location.search);
  const requestedTab = params.get('tab');
  const requestedModule = normalizeModule(params.get('module'))
    || getModuleFromTab(requestedTab)
    || selectedModule
    || 'joints';
  const initialTab = requestedTab && getModuleFromTab(requestedTab) === requestedModule
    ? requestedTab
    : defaultTabs[requestedModule];

  const root = document.documentElement;
  root.dataset.activeModule = requestedModule;
  root.dataset.activeTab = initialTab;
  root.dataset.appReady = 'false';
})();
</script>
<style>
html[data-app-ready="false"] #module-tab-rail {
  visibility: hidden;
}

html[data-app-ready="false"] #module-content-root {
  min-height: calc(100vh - 112px);
}
</style>
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/cases.css">
<link rel="stylesheet" href="css/print.css">
</head>
<body>

<div class="toolbar">
  <a href="index.html" class="toolbar-back">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 3L5 8l5 5"/></svg>
    Hub
  </a>
  <div class="toolbar-divider"></div>
  <span class="toolbar-logo">Rheum<strong>Lab</strong></span>
  <div class="module-seg" id="module-switcher">
    <button type="button" data-module="joints">Joints</button>
    <button type="button" data-module="ana">ANA</button>
    <button type="button" data-module="anca">ANCA</button>
  </div>
</div>

<div class="tab-rail" id="module-tab-rail" aria-label="Module tabs"></div>
<main id="module-content-root" class="module-shell"></main>

<div class="container">
  <div class="footnote">RheumLab</div>
</div>

<script type="module" src="js/app.js?v=20260307c"></script>
</body>
</html>
